[project]
name = "minerag"
version = "0.1.0"
description = "Study-oriented RAG over homework, exams, notes, and solutions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.85.0",
    "black>=26.3.1",
    "chromadb>=1.5.5",
    "huggingface-hub>=1.6.0",
    "mwparserfromhell>=0.7.2",
    "openai>=2.26.0",
    "pypdf>=5.5.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.55.0",
    "torch>=2.10.0",
    "tqdm>=4.67.0",
    "transformers>=5.3.0",
    "wikiteam3>=4.4.8",
]

[project.scripts]
scrape = "src.ingest.scrape:main"
ingest = "src.ingest.ingest:main"
embed-all = "src.ingest.embed:main_embed_all"
embed-missing = "src.ingest.embed:main_embed_missing"
embed-files = "src.ingest.embed:main_embed_files"
convert-missing = "src.ingest.convert:main_convert_missing"
convert-files = "src.ingest.convert:main_convert_files"
evaluate = "src.eval.harness:main"
beir-ingest = "src.eval.beir_ingest:main"
beir-eval = "src.eval.beir_eval:main"
build-wiki = "src.wiki.build:main"
test-workflow = "src.workflow_regression:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
target-version = ["py312"]
